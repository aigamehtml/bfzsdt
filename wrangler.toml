# 定投导航仪 - Cloudflare Workers 配置
# 一体化部署：Worker（后端）+ 静态前端（public/index.html）同域发布
# 部署：`wrangler deploy`（会自动上传 public/ 下的前端）
# 访问：https://dingtou-worker.<你的子域>.workers.dev

name = "dingtou-worker"
main = "worker.js"
compatibility_date = "2026-08-07"

# 关闭版本预览地址（<version>-dingtou-worker.*.workers.dev），减少对外入口
preview_urls = false

[[kv_namespaces]]
binding = "STORE"
id = "f88edeb10743499b88324298364e6db6"

# 前端静态资源：与 Worker 同域部署，同源访问无需 CORS
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ===== 定时任务（Cron Trigger）=====
# 注意：Cron 一律按 UTC 执行，无时区配置项。北京 = UTC+8，故 UTC 16:05 = 北京次日 00:05。
# 当前：每日 00:05（北京）自动刷新全部账户的基金净值（含周末；周末无新净值时刷新结果与上一交易日一致）。
# 定时任务只刷净值，不做信号推送——信号推送由打开看板（GET /api/state）时按需触发。
# 改动后需最多 15 分钟才在全网生效；部署时本数组会整体替换线上已有的 cron。
[triggers]
crons = ["5 16 * * *"]

