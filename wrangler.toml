# 定投导航仪 - Cloudflare Workers 配置
# 一体化部署：Worker（后端）+ 静态前端（public/index.html）同域发布
# 部署：`wrangler deploy`（会自动上传 public/ 下的前端）
# 访问：https://dingtou-worker.<你的子域>.workers.dev

name = "dingtou-worker"
main = "worker.js"
compatibility_date = "2026-08-07"

# 关闭版本预览地址（<version>-dingtou-worker.*.workers.dev），减少对外入口
preview_urls = false

[[kv_namespaces]]
binding = "STORE"
id = "f88edeb10743499b88324298364e6db6"

# 前端静态资源：与 Worker 同域部署，同源访问无需 CORS
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ===== 定时任务（Cron Trigger）=====
# 注意：Cron 一律按 UTC 执行，无时区配置项。北京 = UTC+8，故 20:00 北京 = 12:00 UTC。
# 周几：1=周日 … 7=周六（与常见 0=周日 不同），这里用 MON-FRI 缩写避免歧义。
# 当前：工作日 20:00（北京）自动刷新全部账户净值 + 检测信号并推送。
# 想盘中更频繁跟进，可改成如 "*/30 * * * *"（每 30 分钟），但注意免费版 CPU 配额与请求数。
# 改动后需最多 15 分钟才在全网生效；部署时本数组会整体替换线上已有的 cron。
[triggers]
crons = ["0 12 * * MON-FRI"]

