# 定投导航仪 - Cloudflare Workers 配置
# 一体化部署：Worker（后端）+ 静态前端（public/index.html）同域发布
# 部署：`wrangler deploy`（会自动上传 public/ 下的前端）
# 访问：https://dingtou-worker.<你的子域>.workers.dev

name = "dingtou-worker"
main = "worker.js"
compatibility_date = "2026-08-07"

# 关闭版本预览地址（<version>-dingtou-worker.*.workers.dev），减少对外入口
preview_urls = false

[[kv_namespaces]]
binding = "STORE"
id = "f88edeb10743499b88324298364e6db6"

# ===== 只读 API Key（可选，供外部 AI / 自动化工具抓取 /api/llm-context）=====
# 密钥不写在这里（本文件会进 GitHub），用 Wrangler Secret 注入，运行时读 env.LLM_CONTEXT_KEY：
#   npx wrangler secret put LLM_CONTEXT_KEY
# 生成一个足够长的随机值，例如：openssl rand -hex 32
# 本地开发可在项目根放 .dev.vars（已加入 .gitignore）：LLM_CONTEXT_KEY=xxxx
# 不配置时该通道关闭，接口维持原有「登录后 Cookie 访问」行为，不会对外敞开。
# 前端设置页 / 导出备份 / KV 均不包含此密钥。

# 前端静态资源：与 Worker 同域部署，同源访问无需 CORS
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ===== 定时任务：已停用（2026-11-25 应用户要求删除每日自动刷新）=====
# 注意：Cloudflare 的规则是「部署时用配置里的数组整体替换线上 cron」，
# 但**不写 [triggers] 段会保留线上已有的 cron**，只删代码不删配置的话定时任务仍会触发。
# 因此这里显式声明空数组：部署后线上 cron 会被清空。
# 想恢复自动刷新：把 crons 改回 ["5 16 * * *"]（UTC 16:05 = 北京次日 00:05），
# 并在 worker.js 里重新实现 scheduled() 处理函数。
[triggers]
crons = []

