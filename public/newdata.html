<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f6">
  <meta name="robots" content="noindex, nofollow">
  <title>数据更新</title>
  <style>
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #172b27;
      --text-secondary: #64736f;
      --text-tertiary: #94a19d;
      --primary: #159a78;
      --primary-dark: #087a5d;
      --primary-light: #e0f5ee;
      --danger: #d94f59;
      --danger-light: #fff0f0;
      --warning: #c88928;
      --warning-light: #fff4df;
      --border: #e5ece9;
      --shadow: 0 3px 12px rgba(26, 54, 45, .055);
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      padding: calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      display: flex;
      justify-content: center;
    }
    .wrap { width: 100%; max-width: 480px; }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 0 2px;
    }
    .head h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.4px;
    }
    .head a {
      color: var(--text-secondary);
      font-size: 13px;
      text-decoration: none;
      padding: 4px 0;
    }
    .head a:active { color: var(--primary); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 14px;
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: .3px;
      margin-bottom: 10px;
    }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--text-tertiary);
      border-bottom: 2px solid var(--text-tertiary);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    select {
      width: 100%;
      height: 50px;
      padding: 0 40px 0 14px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: #fbfdfc;
      border: 1px solid var(--border);
      border-radius: 12px;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus-visible {
      outline: 3px solid rgba(21, 154, 120, .28);
      outline-offset: 1px;
    }
    .btn {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .5px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 6px 16px rgba(21, 154, 120, .22);
      cursor: pointer;
      transition: background-color .18s ease, color .18s ease, box-shadow .18s ease, transform .1s ease;
    }
    .btn:active:not(:disabled) { transform: scale(.985); }
    .btn:disabled { cursor: default; }
    .btn:focus-visible {
      outline: 3px solid rgba(21, 154, 120, .35);
      outline-offset: 2px;
    }
    .btn.is-loading {
      background: #bcd9d0;
      color: #3d5a53;
      box-shadow: none;
    }
    .btn.is-done {
      background: var(--primary-light);
      color: var(--primary-dark);
      box-shadow: none;
      border: 1px solid rgba(21, 154, 120, .35);
    }
    .btn.is-warn {
      background: var(--warning-light);
      color: #8a5d16;
      box-shadow: none;
      border: 1px solid rgba(200, 137, 40, .35);
    }
    .btn.is-error {
      background: var(--danger-light);
      color: #a3313a;
      box-shadow: none;
      border: 1px solid rgba(217, 79, 89, .35);
    }
    .hint {
      min-height: 18px;
      margin: 10px 2px 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-secondary);
      text-align: center;
    }
    .hint:empty { margin-top: 0; min-height: 0; }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>数据更新</h1>
      <a href="/">返回看板</a>
    </header>

    <section class="card">
      <label class="label" for="accountSelect">切换账户</label>
      <div class="select-wrap">
        <select id="accountSelect" aria-label="选择账户"></select>
      </div>
    </section>

    <section class="card">
      <label class="label" for="btnRefresh">更新数据</label>
      <button id="btnRefresh" class="btn" type="button">刷新数据</button>
      <p id="hint" class="hint" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const sel = $("accountSelect");
    const btn = $("btnRefresh");
    const hint = $("hint");

    const LABEL_IDLE = "刷新数据";
    const LABEL_BUSY = "更新中…";
    let busy = false;
    let resetTimer = null;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }
    function clockText() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    async function api(path, options) {
      const opts = Object.assign({ credentials: "same-origin" }, options || {});
      if (opts.body !== undefined) {
        opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      }
      const res = await fetch(path, opts);
      if (res.status === 401) {
        location.href = "/";
        throw new Error("登录已过期");
      }
      let data = {};
      try { data = await res.json(); } catch (_) { /* 非 JSON 响应按失败处理 */ }
      if (!res.ok || data.success === false) {
        throw new Error(data.message || `请求失败（HTTP ${res.status}）`);
      }
      return data;
    }

    function setBtn(cls, text, disabled) {
      btn.className = "btn" + (cls ? " " + cls : "");
      btn.textContent = text;
      btn.disabled = !!disabled;
    }

    function scheduleReset(ms) {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        setBtn("", LABEL_IDLE, false);
        hint.textContent = "";
      }, ms);
    }

    /* 账户切换 */
    async function loadAccounts() {
      const s = await api("/api/state");
      const accounts = s.accounts || [];
      const counts = s.fundCounts || {};
      if (!accounts.length) {
        sel.innerHTML = '<option value="">暂无账户</option>';
        sel.disabled = true;
        return;
      }
      sel.innerHTML = accounts.map((a) => {
        const n = counts[a.name];
        const suffix = n === undefined ? "" : ` · ${n} 只`;
        return `<option value="${esc(a.name)}"${a.name === s.currentAccount ? " selected" : ""}>${esc(a.name)}${suffix}</option>`;
      }).join("");
    }

    sel.addEventListener("change", async () => {
      const name = sel.value;
      if (!name) return;
      sel.disabled = true;
      try {
        await api("/api/current-account", { method: "POST", body: JSON.stringify({ name }) });
        hint.textContent = `已切换到「${name}」`;
      } catch (e) {
        hint.textContent = e.message || "切换失败";
        await loadAccounts().catch(() => {});
      } finally {
        sel.disabled = false;
      }
    });

    /* 更新数据：成功不弹窗，只把按钮文字改成「已更新」 */
    btn.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      clearTimeout(resetTimer);
      setBtn("is-loading", LABEL_BUSY, true);
      hint.textContent = "";
      try {
        const r = await api("/api/refresh-all", { method: "POST" });
        const ok = Number(r.ok || 0);
        const fail = Number(r.fail || 0);
        if (fail > 0 && ok > 0) {
          setBtn("is-warn", "部分失败", true);
          hint.textContent = `${ok} 只已更新，${fail} 只失败 · ${clockText()}`;
        } else if (fail > 0 || ok === 0) {
          setBtn("is-error", "更新失败", true);
          hint.textContent = `没有基金更新成功 · ${clockText()}`;
        } else {
          setBtn("is-done", "已更新", true);
          hint.textContent = `${ok} 只基金已刷新 · ${clockText()}`;
        }
      } catch (e) {
        setBtn("is-error", "更新失败", true);
        hint.textContent = e.message || "请稍后重试";
      } finally {
        busy = false;
        scheduleReset(2800);
      }
    });

    loadAccounts().catch((e) => {
      hint.textContent = e.message || "加载失败";
    });
  </script>
</body>
</html>
